<!doctype html>
<!-- Source for public/og.png (1200x630). Rebuild with: sh scripts/og.sh -->
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Playfair+Display:ital,wght@1,400&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex; align-items: center; gap: 48px; padding: 0 64px 0 56px;
        background: radial-gradient(70% 90% at 100% 100%, #15263a 0%, #070d13 60%);
        color: #f6ecdd; font-family: Montserrat, sans-serif;
      }
      img { width: 400px; height: auto; flex: none; }
      .caps { font-size: 17px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #f5b35e; display: flex; align-items: flex-end; gap: 14px; }
      .bars { display: inline-flex; align-items: flex-end; gap: 4px; height: 20px; }
      .bars i { width: 4px; border-radius: 4px; background: #f0a64b; }
      h1 { margin-top: 26px; font-size: 38px; white-space: nowrap; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
      h1 em { display: block; margin-top: 4px; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 100px; line-height: 1; letter-spacing: -0.01em; }
      .url { margin-top: 34px; font-size: 20px; font-weight: 600; color: #97a9b9; }
    </style>
  </head>
  <body>
    <img src="../public/brand/logo-dark.webp" alt="" />
    <div>
      <p class="caps"><span class="bars"><i style="height:100%"></i><i style="height:50%"></i><i style="height:72%"></i><i style="height:50%"></i></span>Live song maps · Free for Mac</p>
      <h1>Living-room worship meets <em>the downbeat.</em></h1>
      <p class="url">lampcircle.truefrontier.app</p>
    </div>
  </body>
</html>
